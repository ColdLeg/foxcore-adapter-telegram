[package]
name = "foxcore-adapter-telegram"
version = "0.1.0"
edition = "2024"
description = "FoxCore Telegram Bot API 动态适配器插件"
license-file = "LICENSE"
rust-version = "1.92"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# ABI 1.7 = FoxNature 最新主程序匹配版本（SDK 0.3.0）
foxcore-plugin-sdk = { git = "https://github.com/KitsuneFlora/foxcore-plugin-sdk", rev = "e26be665b00df5d2fb1e62c1b3ce5a0c33ba578c" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
