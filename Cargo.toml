[package]
name = "foxcore-adapter-telegram"
version = "0.1.0"
edition = "2024"
description = "FoxCore Telegram Bot API 动态适配器插件"
license-file = "LICENSE"
rust-version = "1.92"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
foxcore-plugin-sdk = { git = "https://github.com/KitsuneFlora/foxcore-plugin-sdk", rev = "1f6b08a201a5e548fc8539ab7fe306a2d3d31e9d" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
